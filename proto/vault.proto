syntax = "proto3";

package passwordium.vault.v1;

option go_package = "github.com/dmi3midd/passwordium/internal/vault/pb";

// EncryptedVaultFile is the outer wrapper serialized and stored on disk (e.g. vault.enc).
message EncryptedVaultFile {
  uint32 version = 1;
  bytes salt = 2;              // 32 bytes for Argon2id
  bytes file_nonce = 3;        // 24 bytes for XChaCha20-Poly1305
  bytes encrypted_payload = 4; // VaultPayload encrypted with fileKey (AAD = version + salt)
}

// VaultPayload is the inner payload decrypted using fileKey.
message VaultPayload {
  repeated VaultEntry entries = 1;
}

// VaultEntry represents a single credential entry. Sensitive fields (password, notes)
// remain encrypted in memory with entryKey (AAD = id) until explicitly requested.
message VaultEntry {
  string id = 1;
  string title = 2;
  string username = 3;
  string url = 4;
  bytes password_nonce = 5;
  bytes encrypted_password = 6;
  bytes notes_nonce = 7;
  bytes encrypted_notes = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

