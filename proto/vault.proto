syntax = "proto3";

package passwordium.v1;

option go_package = "github.com/dmi3midd/passwordium/internal/vaultpb;vaultpb";

// VaultData is the top-level serialized payload stored inside the outer
// XChaCha20-Poly1305 ciphertext. All timestamps are Unix seconds in UTC.
message VaultData {
  uint64 version = 1;
  int64 updated_at = 2;
  repeated Entry entries = 3;
}

// Entry stores searchable metadata in the vault container alongside the
// independently encrypted SecretPayload. All timestamps are Unix seconds in UTC.
message Entry {
  string id = 1;
  uint64 version = 2;
  string title = 3;
  string username = 4;
  string url = 5;
  repeated string tags = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  bytes secret_nonce = 9;
  bytes encrypted_secret = 10;
}

// SecretPayload contains the sensitive portion of an Entry, encrypted
// individually using secretKey with AAD "<entry_id>:<entry_version>".
message SecretPayload {
  string password = 1;
  string notes = 2;
  map<string, string> custom_fields = 3;
}
